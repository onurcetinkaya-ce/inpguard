[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inpguard"
version = "0.1.0"
description = "Defensive linting for EPANET .inp water-network model files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Onur Çetinkaya" }]
keywords = ["epanet", "water", "scada", "ics", "security", "lint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Hydrology",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Source = "https://github.com/onurcetinkaya-ce/inpguard"

[project.scripts]
inpguard = "inpguard.cli:main"

[tool.setuptools.packages.find]
include = ["inpguard*"]