name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the CLI on the corpus
        run: |
          python -c "from inpguard.corpus import CASES; [open(c.name + '.inp','w',encoding='utf-8').write(c.data) for c in CASES]"
          python -m inpguard.cli check clean.inp
          python -m inpguard.cli check dangling_node.inp || true
          python -m inpguard.cli check clean.inp --json

  lint:
    name: self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Ensure the clean corpus case stays clean
        run: |
          python - <<'PY'
          from inpguard import lint_text
          from inpguard.corpus import CLEAN
          report = lint_text(CLEAN)
          assert report.ok(), [str(f) for f in report.findings]
          assert report.findings == [], [str(f) for f in report.findings]
          print("clean case lints clean")
          PY